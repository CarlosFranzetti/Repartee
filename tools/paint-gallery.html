/* simulate the engine's light pass: multiply tint, then restore emissive rects from the unlit snapshot */
function relight(c, em, tint, pools) {
  const snap = U.mk(640, 256); snap.getContext("2d").drawImage(c.canvas, 0, 0);
  c.globalCompositeOperation = "multiply"; c.fillStyle = tint; c.fillRect(0, 0, 640, 256);
  c.globalCompositeOperation = "source-over";
  (pools || []).forEach(p => {
    const g = c.createRadialGradient(p[0], p[1], 2, p[0], p[1], p[2]);
    g.addColorStop(0, p[3]); g.addColorStop(1, "rgba(0,0,0,0)");
    c.globalCompositeOperation = "lighter"; c.fillStyle = g; c.fillRect(0, 0, 640, 256); c.globalCompositeOperation = "source-over";
  });
  em.forEach(r => { if (r && r[2] > 0 && r[3] > 0) c.drawImage(snap, r[0], r[1], r[2], r[3], r[0], r[1], r[2], r[3]); });
}

function scene(title, fn, o) {
  o = o || {};
  const wrap = document.createElement("div"); wrap.className = "scene" + (o.tall ? " tall" : "");
  const h2 = document.createElement("h2"); wrap.appendChild(h2);
  const cv = document.createElement("canvas"); cv.width = 640; cv.height = o.tall ? 512 : 256; wrap.appendChild(cv); root.appendChild(wrap);
  const c = cv.getContext("2d"); c.imageSmoothingEnabled = false;
  const em = [];
  const E = r => { if (r && r.length) for (let i = 0; i < r.length; i++) em.push(r[i]); return r; };
  const t0 = performance.now();
  fn(c, E);
  const ms = performance.now() - t0;
  timings.push([title, ms]);
  h2.textContent = title + "   [" + ms.toFixed(0) + " ms, " + em.length + " emissive rects]" + (o.light ? "   (click: raw / lit)" : "");
  if (o.light) {
    const raw = U.mk(640, 256); raw.getContext("2d").drawImage(cv, 0, 0);
    let lit = true; relight(c, em, o.light.tint, o.light.pools);
    cv.addEventListener("click", () => {
      lit = !lit; c.clearRect(0, 0, 640, 256); c.drawImage(raw, 0, 0);
      if (lit) relight(c, em, o.light.tint, o.light.pools);
    });
  }
}
