<!doctype html><meta charset="utf-8"><title>chars</title>
<style>body{background:#222;margin:0}canvas{image-rendering:pixelated;width:1920px;height:1080px;display:block}</style>
<canvas id="c" width="640" height="360"></canvas>
<script src="../src/core/util.js"></script>
<script src="../src/core/chars.js"></script>
<script>
const {R,P,bayer} = RP.u;
const c = document.getElementById('c').getContext('2d');
// backdrop: wall + floor
R(c,0,0,640,360,'#5a4a6a'); for(let y=200;y<360;y++) R(c,0,y,640,1, y%9?'#7a5a3e':'#5e3a28');
for(let y=0;y<200;y++)for(let x=0;x<640;x++) if(bayer(x,y)<2) P(c,x,y,'#4a3a5a');
RP.chars.define('kid',{name:'Kid',skin:'#e0a27a',hair:{style:'messy',color:'#5a3520'},top:{style:'tee',color:'#17131f',print:'circle'},bottom:{style:'jeans',color:'#2f5a96'},shoes:{style:'sneakers',color:'#efeaf6'}});
RP.chars.define('lou',{height:90,build:'big',skin:'#c98a62',hair:{style:'bald',color:'#9a9aa6'},facial:'mustache',facialColor:'#9a9aa6',top:{style:'cardigan',color:'#7a5a3a',color2:'#efeaf6'},bottom:{style:'pants',color:'#4a4a5a'},shoes:{style:'shoes',color:'#3a2418'},acc:['glasses']});
RP.chars.define('dante',{height:100,build:'average',skin:'#8d5a3b',hair:{style:'buzz',color:'#1c1418'},facial:'goatee',top:{style:'bomber',color:'#1c1a24',color2:'#ff3fa4'},bottom:{style:'pants',color:'#17131f'},shoes:{style:'sneakers',color:'#efeaf6'},acc:['chain','shades']});
RP.chars.define('ray',{height:94,build:'stocky',skin:'#f1c7a5',hair:{style:'long',color:'#9a9aa6'},facial:'beard',top:{style:'shirt',color:'#5a7a4a'},bottom:{style:'jeans',color:'#21416f'},shoes:{style:'boots',color:'#5a3424'},acc:['glasses']});
RP.chars.define('brenda',{height:90,figure:'curvy',skin:'#b07650',hair:{style:'bun',color:'#2e1d16'},top:{style:'suit',color:'#2a3a5a',color2:'#efeaf6',tie:false},bottom:{style:'skirt',color:'#2a3a5a'},shoes:{style:'shoes',color:'#17131f'},acc:['glasses','lanyard']});
RP.chars.define('tank',{height:104,build:'big',skin:'#6e4329',hair:{style:'buzz',color:'#1c1418'},top:{style:'tee',color:'#17131f',print:'text',text:'SECURITY'},bottom:{style:'pants',color:'#17131f'},shoes:{style:'boots',color:'#17131f'},acc:['earring']});
RP.chars.define('promo',{height:92,figure:'curvy',skin:'#e8b48f',hair:{style:'long',color:'#ff6cbb'},top:{style:'dress',color:'#7a3fb0'},bottom:{style:'none',color:'#7a3fb0'},shoes:{style:'boots',color:'#17131f'},acc:['clipboard','earring']});
const S = 1;
let x = 30;
const L = new URLSearchParams(location.search);
const lx = +(L.get('lx')||-1);
const rim = L.get('rim') ? {color:'#ff3fa4', side: 1} : null;
const items = [
 ['kid','front','stand'],['kid','right','walk',1],['kid','left','walk',2],['kid','back','stand'],['kid','front','dance',0],['kid','back','dj',0],['kid','right','reach'],
 ['lou','front','stand'],['dante','front','phone'],['ray','right','stand'],['brenda','front','sit'],['tank','front','stand'],['promo','front','stand'],['promo','right','walk',1]
];
items.forEach((it,i)=>{
  const X = 30 + (i%7)*88, Y = i<7? 170 : 340;
  RP.chars.draw(c,{id:it[0],x:X,y:Y,face:it[1],act:it[2],frame:it[3]||0, expr: i==7?'angry':undefined, mouth: i==8},{lx, rim, cast:true, shadow:0.6});
});
for(let i=0;i<8;i++) RP.chars.draw(c,{def:RP.chars.random(i+3),x:20+i*20,y:200+ (i%2)*6,face:'back',act:'dance',frame:i%4,scale:0.8},{lx:0.5});
</script>
